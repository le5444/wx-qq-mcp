<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信与 QQ · 媒体阅读</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#182c29;font:15px/1.65 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:32px max(28px,calc((100vw - 1120px)/2));background:#173c35;color:white}h1{font-size:27px;margin:0 0 8px;font-weight:600}header p{margin:0;color:#d1e5de;font-size:13px}.stats{display:flex;gap:32px;margin-top:22px}.stats strong{display:block;font-size:23px;color:white}.stats span{font-size:12px;color:#c6dcd3}main{max-width:1180px;margin:auto;padding:24px 28px}.filters{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#f5f5f2ed;backdrop-filter:blur(8px);padding:12px 0;z-index:2}input,select,button{font:inherit;padding:9px 12px;border:1px solid #cad5ce;border-radius:8px;background:white;color:#183c30}input{flex:1;min-width:220px}button{cursor:pointer}button:disabled{opacity:.4}.statusline{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px;color:#587267;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #dce3dc;border-radius:12px;padding:18px;overflow:hidden}.meta{font-size:12px;color:#61796c;display:flex;justify-content:space-between;gap:10px}.sender{margin:6px 0 12px;font-weight:600}.tag{font-size:11px;display:inline-block;background:#e9f2ed;padding:2px 7px;border-radius:5px;color:#35634b;margin-left:8px}.media{background:#f3f3ef;display:flex;justify-content:center;align-items:center;min-height:80px;max-height:440px;overflow:hidden;border-radius:8px}.media img{max-width:100%;max-height:440px;object-fit:contain}.media video{width:100%;max-height:440px}audio{width:100%;margin:8px 0}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;font-size:14px}.note{font-size:12px;color:#728178}.missing{padding:30px 14px;background:#f4f1eb;color:#827459;border-radius:8px;text-align:center}.links{display:flex;gap:14px;margin-top:9px;font-size:12px}a{color:#237656}details{margin-top:12px;border-top:1px solid #edf0eb;padding-top:10px}summary{cursor:pointer;color:#4c6f5c;font-size:13px}.pager{display:flex;gap:16px;justify-content:center;align-items:center;margin:28px}.empty{padding:50px;text-align:center;color:#718071}footer{font-size:12px;color:#78857c;text-align:center;margin:20px 0 40px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:14px}.stats{gap:22px}header{padding:24px}.filters{top:0}h1{font-size:22px}}
</style><header><h1>微信与 QQ · 媒体阅读</h1><p>由输入文件生成 · 媒体路径在本机打开</p><div class="stats" id="stats"></div></header><main>
<nav id="partnav" aria-label="阅读分片"></nav><p id="scope" class="note"></p><div class="filters"><input id="search" placeholder="搜索语音转写、图片文字或日期"><select id="category"><option value="">全部类型</option><option value="text">文字</option><option value="image">图片</option><option value="sticker">表情</option><option value="voice">语音</option><option value="video">视频</option></select><select id="platform"><option value="">微信 + QQ</option><option>微信</option><option>QQ</option></select><select id="availability"><option value="">全部记录</option><option value="ready">可查看</option><option value="missing">仅缺失项</option></select></div>
<div class="statusline"><span id="count"></span><span>自动转写和 OCR 可有误，请结合原音原图</span></div><div class="grid" id="grid"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><footer>此阅读页在本机打开，图片、音频和视频均使用本地文件。无文字识别结果不代表图片没有其他内容。本阅读页仅引用输入中的本地文件；视频验证范围以导入结果为准，页面不重新验证媒体内容。</footer></main>
<script>const data=__DATA__;document.title=data.report.title;document.querySelector("h1").textContent=data.report.title;let page=0,filtered=[];const size=30,$=s=>document.getElementById(s),labels={text:'文字',image:'图片',sticker:'表情',voice:'语音',video:'视频'};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function link(path,label){const a=el('a','',label);a.href=path;a.target='_blank';a.rel='noopener';return a}
function select(){const term=$('search').value.trim().toLowerCase();filtered=data.items.filter(r=>(!$('category').value||r.category===$('category').value)&&(!$('platform').value||r.source===$('platform').value)&&(!$('availability').value||($('availability').value==='ready'?r.available:!r.available))&&(!term||(r.text+' '+r.ocr+' '+r.time+' '+r.sender).toLowerCase().includes(term)));page=0;render()}
function render(){$('grid').replaceChildren();$('count').textContent=`共 ${filtered.length.toLocaleString()} 条符合条件`;const max=Math.max(1,Math.ceil(filtered.length/size));$('page').textContent=`${page+1} / ${max}`;$('prev').disabled=page===0;$('next').disabled=page+1>=max;
for(const r of filtered.slice(page*size,(page+1)*size)){const c=el('article','card'),meta=el('div','meta');meta.append(el('span','',r.source+' · '+labels[r.category]),el('span','',r.time.replace('T',' ').replace(/\+08:00$/,'')));c.append(meta,el('div','sender',r.sender));if(r.only_thumbnail)c.append(el('div','note','目前只有缩略图，可在微信中查看或下载原图'));if(r.review_required)c.append(el('div','note','这条自动转写建议优先核对原音'));
if(r.images.length){for(const path of r.images){const box=el('a','media');box.href=path;box.target='_blank';const im=el('img');im.loading='lazy';im.src=path;im.alt='点击查看本地原图';box.append(im);c.append(box)}}
if(r.audio){const a=el('audio');a.controls=true;a.preload='metadata';a.src=r.audio;c.append(a,el('div','note','本地自动转写 · 可播放核对'))}
if(r.videos.length){for(const path of r.videos){const box=el('div','media'),v=el('video');v.controls=true;v.preload='none';v.src=path;if(r.covers.length)v.poster=r.covers[0];box.append(v);c.append(box)}}
if(!r.available){if(r.covers.length){const box=el('div','media'),im=el('img');im.src=r.covers[0];im.loading='lazy';box.append(im);c.append(box)}c.append(el('div','missing',r.category==='video'?'本地视频缺失，可能仅保留封面':'暂没有可读取的本地实体'))}
if(r.text)c.append(el('div','text',r.text.replace('[语音·本地自动识别] ','')));if(r.ocr){const d=el('details'),s=el('summary','','查看图片文字识别结果');d.append(s,el('div','text',r.ocr));c.append(d)}const links=el('div','links');if(r.images.length)links.append(link(r.images[0],'打开图片文件'));if(r.audio)links.append(link(r.audio,'打开音频'));if(r.videos.length)links.append(link(r.videos[0],'打开视频'));c.append(links);$('grid').append(c)}if(!filtered.length)$('grid').append(el('div','empty','没有符合条件的媒体'))}
$('scope').textContent=data.report.scope||'';const nav=data.navigation||{};for(const [key,label] of [['index','返回目录'],['previous','上一分片'],['next','下一分片']]){if(nav[key]){const a=link(nav[key],label);a.target='_self';a.style.marginRight='20px';$('partnav').append(a)}}const available=data.items.filter(r=>r.available).length;for(const [n,label] of [[data.report.records,'聊天记录'],[data.items.length,'显示条目'],[available,'可查看条目']]){const box=el('div');box.append(el('strong','',n.toLocaleString()),el('span','',label));$('stats').append(box)}for(const name of ['search','category','platform','availability'])$(name).addEventListener(name==='search'?'input':'change',select);$('prev').onclick=()=>{page--;render();scrollTo(0,150)};$('next').onclick=()=>{page++;render();scrollTo(0,150)};select();
</script></html>
